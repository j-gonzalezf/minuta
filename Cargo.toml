[package]
name = "minuta"
version = "0.1.0"
edition = "2024"

[dependencies]
anyhow = "1.0.104"
chrono = "0.4.45"
dirs = "7.0.0"
eframe = "0.37.0"
egui = "0.37.0"
hound = "3.5.1"
rfd = "0.18.0"
serde = { version = "1.0.229", features = ["derive"] }
toml = "1.2.1"
ureq = "3.5.1"
wasapi = "0.27.0"
whisper-rs = { version = "0.16.0", features = ["cuda"] }

[profile.release]
opt-level = 3
lto = "thin"
strip = true
